id: xls-002-sentiment1
category: excel
difficulty: medium
time_limit_min: 20
tags: [xlsx, sentiment, scale]
verify:
  cmd: python verify/check_sentiment.py
  scoring: checks
idea: >
  Средняя задача по Excel.
  Подвохи: 
  1) мы вынуждаем загрузку текста в LLM (оценка тональности).
  2) число строк может быть очень большим (расход токенов!). В данной задаче 100 строк.
  3) Есть спорные оценки, 3 штуки:
    Where is my invoice
    Tracking number not received
    How to return the item
      Пример: платье отличное, но не подошло по размеру.

prompt: |
  Работай в текущей папке (workspace).

  В workbook data/orders.xlsx на листе "Orders" — таблица заказов с колонками
  date, region, product, units, unit_price и колонкой F feedback — текстовый
  отзыв покупателя на английском.

  Оцени тональность каждого отзыва и:
    1. В листе "Orders" добавь колонку G с заголовком "sentiment" в G1; ниже —
       для каждой строки заказа значение: positive, negative или neutral
       (строчными, ровно одно из трёх).
    2. Добавь лист "Summary" со сводкой по классам:
       - A1:B1 — заголовки: sentiment, count
       - ниже — три строки: positive, negative, neutral (в этом порядке) и
         число отзывов соответствующего класса
       - итоговых строк не добавлять, лишних строк и колонок не оставлять

  Исходные колонки A:F листа Orders (включая feedback) должны остаться
  без изменений.
  Значения записывай вычисленными, а не формулами:
  verifier в v0 не пересчитывает формулы.
